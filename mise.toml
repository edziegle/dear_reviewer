[tools]
node = "24"
vale = "3.24.0"

# The tests' VSCodium, pinned at engines.vscode's floor: raise both together.
# Kept out of /Applications, so the tests and your own VSCodium don't share an
# install, and downloaded by mise, so macOS never quarantines it. CI runs it
# on Linux only (docs/adr/0035-integration-tests-on-linux-only.md).
[tools."github:VSCodium/vscodium"]
version = "1.135.06055"
os = ["macos", "linux"]

# strip_components = 0 keeps VSCodium.app, which `open -a` needs.
[tools."github:VSCodium/vscodium".platforms]
macos-arm64 = { asset_pattern = "VSCodium-darwin-arm64-*.zip", strip_components = 0 }
macos-x64 = { asset_pattern = "VSCodium-darwin-x64-*.zip", strip_components = 0 }
linux-x64 = { asset_pattern = "VSCodium-linux-x64-*.tar.gz", strip_components = 0 }
linux-arm64 = { asset_pattern = "VSCodium-linux-arm64-*.tar.gz", strip_components = 0 }

[tasks.setup]
description = "Install dependencies and Vale styles"
depends = ["deps", "vale-sync"]

[tasks.deps]
description = "Install npm dependencies"
run = ["npm ci", "npm ci --prefix extension"]

[tasks.vale-sync]
description = "Download the Vale packages .vale.ini names"
run = "vale sync"

[tasks.typecheck]
description = "Type-check the extension and its tests"
dir = "extension"
run = [
  "npx tsc --noEmit",
  "npx tsc -p test --noEmit",
  "npx tsc -p test/unit --noEmit",
]

# No vscode:prepublish script: the package task builds first, so vsce has nothing to run.
[tasks.build]
description = "Bundle the extension"
dir = "extension"
run = "node esbuild.mjs"
sources = ["src/**/*.ts", "esbuild.mjs", "package.json", "package-lock.json"]
outputs = ["dist/extension.js", "dist/gitServer.js"]

# A status bar item can show only an icon font's glyph, not an SVG, so the
# logo is also built as a one-glyph font. The font is committed, so
# packaging doesn't need this task; run it after changing the logo.
[tasks.logo-font]
description = "Build the logo's icon font from media/dear-reviewer.svg"
dir = "extension"
run = """
glyphs=$(mktemp -d)
cp media/dear-reviewer.svg "$glyphs/dear-reviewer-logo.svg"
npx fantasticon "$glyphs" --config logo-font.json --output media --silent
rm -r "$glyphs"
"""

# Unit tests run pure modules under plain Node, without VSCodium or a build:
# those of src/ from test/unit/, and the runner's from test/. tsc compiles
# only the tests and what they import; out/unit is cleared first so a
# deleted test doesn't run on.
[tasks.test-unit]
description = "Run the unit tests under Node, without VSCodium"
dir = "extension"
usage = 'arg "[name]" help="One test file, such as prompts for test/unit/prompts.test.ts or runPlan for test/runPlan.test.ts; all without it"'
run = [
  "rm -rf out/unit",
  "npx tsc -p test/unit",
  'npx mocha "out/unit/test/{,unit/}${usage_name:-*}.test.js"',
]

[tasks.test-integration]
description = "Run the integration tests in VSCodium"
dir = "extension"
depends = ["typecheck", "build"]
run = [
  "rm -rf out/test",
  "npx tsc -p test",
  'CODIUM_DIR="$(mise where github:VSCodium/vscodium)" node out/test/run.js',
]

# Opens a visible VSCodium window, so leave the machine alone while it runs.
# The screenshots land in docs/images/screenshots, or in $DEAR_REVIEWER_SCREENSHOTS.
[tasks.screenshots]
description = "Take the marketing screenshots in VSCodium, in a dark and a light theme"
dir = "extension"
depends = ["typecheck", "build"]
run = [
  "rm -rf out/test",
  "npx tsc -p test",
  'DEAR_REVIEWER_SUITES=screenshots CODIUM_DIR="$(mise where github:VSCodium/vscodium)" node out/test/run.js',
]

[tasks.test]
description = "Run the unit tests, then the integration tests in VSCodium"
depends = ["test-unit"]
run = [{ task = "test-integration" }]

[tasks.lint-docs]
description = "Check prose with Vale; warnings and errors fail, suggestions are advice"
# Vale exits nonzero only on errors, so the second command fails on warnings too.
run = [
  "vale --no-exit docs GLOSSARY.md AGENTS.md DESIGN.md",
  "vale --minAlertLevel=warning --output=line docs GLOSSARY.md AGENTS.md DESIGN.md | awk '{ print } END { exit NR > 0 }'",
]

# A range whose start isn't in the history (a new branch's all-zeros "before", or
# a force-push) lints only the last commit.
[tasks.commitlint]
description = "Check the commit messages in a range against Conventional Commits"
usage = '''
arg "<from>" help="The commit before the range, like the push's before SHA"
arg "[to]" default="HEAD" help="The last commit in the range"
'''
run = '''
if git cat-file -e "$usage_from^{commit}" 2>/dev/null; then
  npx commitlint --from "$usage_from" --to "$usage_to"
else
  npx commitlint --from "$usage_to^" --to "$usage_to"
fi
'''

# Writes to $GITHUB_OUTPUT in CI. A range whose start isn't in the history
# counts as changing code, so the tests still run.
[tasks.code-changed]
description = "Say whether a range changes more than Markdown and docs/"
usage = '''
arg "<from>" help="The commit before the range, like the push's before SHA"
arg "[to]" default="HEAD" help="The last commit in the range"
'''
run = '''
if git cat-file -e "$usage_from^{commit}" 2>/dev/null &&
  git diff --quiet "$usage_from...$usage_to" -- . ':(exclude,glob)**/*.md' ':(exclude)docs'; then
  echo "code=false" >> "${GITHUB_OUTPUT:-/dev/stdout}"
else
  echo "code=true" >> "${GITHUB_OUTPUT:-/dev/stdout}"
fi
'''

[tasks.week]
description = "Print the ISO week, like 2026-W42, for cache keys that rotate weekly"
run = 'echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT:-/dev/stdout}"'


[tasks.fmt-docs]
description = "Format Markdown with Prettier"
run = "npx prettier --write '**/*.md'"

# The root README and LICENSE are the only copies. The listing needs them next
# to package.json, so they're copied in, and git-ignored there, each time. The
# README's Development section and everything after it is for contributors,
# not for someone installing the extension, so the listing leaves it out.
[tasks.package]
description = "Package the extension as a .vsix"
dir = "extension"
depends = ["typecheck", "build"]
run = [
  "sed '/^## Development$/,$d' ../README.md > README.md",
  "cp ../LICENSE .",
  "npx vsce package -o dist/dear-reviewer.vsix",
]

# The Open VSX icon: the cat from the logo, with the words beside it blanked
# out by the transparent rectangle. Needs ImageMagick. The icon is committed,
# so packaging doesn't need this task; run it after changing the logo.
[tasks.icon]
description = "Render media/icon.png from docs/images/logo.png"
dir = "extension"
run = '''
magick ../docs/images/logo.png -alpha set \
  \( -size 485x201 xc:none \) -geometry +515+165 -compose Copy -composite +compose \
  -trim +repage -background none -gravity center -extent 720x720 \
  -resize 256x256 -strip PNG32:media/icon.png
'''

# Installs the build into VSCodium rather than launching an Extension Development
# Host: Dear Reviewer opens Changes in a separate review window, and only an
# installed extension runs there. Extra arguments go to codium: a folder to open.
[tasks.preview]
description = "Install the extension into VSCodium and open it"
depends = ["package"]
dir = "{{cwd}}"
run = [
  'codium --install-extension "{{config_root}}/extension/dist/dear-reviewer.vsix" --force',
  "codium",
]

[tasks.upload-vsix]
description = "Attach the packaged .vsix to a GitHub Release"
dir = "extension"
usage = 'arg "<tag>" help="The release tag, like v0.1.0"'
run = 'gh release upload "$usage_tag" dist/dear-reviewer.vsix --clobber'

# Fails on a .vsix that build-vsix.yml didn't build and attest, such as a local build.
[tasks.verify-vsix]
description = "Check the packaged .vsix against its build provenance attestation"
dir = "extension"
run = """
gh attestation verify dist/dear-reviewer.vsix -R edziegle/dear_reviewer \
  --signer-workflow edziegle/dear_reviewer/.github/workflows/build-vsix.yml \
  --source-ref refs/heads/main
"""

# ovsx has a package of its own, so the job that holds the Open VSX token
# installs it alone, with no install scripts
# (docs/adr/0043-list-each-release-on-open-vsx.md).
[tasks.deps-ovsx]
description = "Install ovsx alone, for releasing to Open VSX"
dir = "tools/ovsx"
run = "npm ci --ignore-scripts"

# ovsx uses OVSX_PAT when it's set, and otherwise exchanges the CI's OIDC token
# for a short-lived one through Open VSX's Trusted Publishing. A version Open VSX
# already has is skipped, so a re-run after a success does nothing. It runs the
# ovsx in tools/ovsx, not npx, which would download the latest ovsx if that
# isn't installed.
[tasks.list-open-vsx]
description = "List the packaged .vsix on Open VSX"
dir = "extension"
run = "../tools/ovsx/node_modules/.bin/ovsx publish dist/dear-reviewer.vsix --skip-duplicate"
