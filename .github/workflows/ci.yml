name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# mise run would otherwise install every tool in mise.toml, VSCodium too, with
# no GitHub token, since mise-action doesn't pass its own on. Each job installs
# only what it needs through mise-action's install_args.
env:
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'extension/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      - run: mise run deps
      - run: mise run package

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: vale
      - run: mise run vale-sync
      - run: mise run lint-docs

  # Reports only: nothing gates on this job.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'extension/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      - run: mise run deps
      - run: mise run commitlint "$FROM" "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

  # Docs-only changes skip the tests; a workflow-level paths-ignore would skip
  # lint-docs too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false
      - id: changes
        run: mise run code-changed "$FROM" "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

  # Pure logic under plain Node: no VSCodium, so it reports in a minute.
  test-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'extension/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      - run: mise run deps
      - run: mise run test-unit

  test-integration:
    needs: changes
    # Only pull requests: a push to main was tested as its pull request. Linux
    # only: its runners start at once (docs/adr/0035-integration-tests-on-linux-only.md).
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A run takes about 6 minutes; a hung one should fail well before the old 30.
    timeout-minutes: 15
    # Only the tests are worth cancelling: a cancelled commitlint run would
    # leave its push's commits unlinted.
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'extension/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node github:VSCodium/vscodium
      - id: week
        run: mise run week
      # The Python and basedpyright extensions from Open VSX, refreshed weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extension/.vscode-test/extensions
          key: vscode-test-extensions-${{ runner.os }}-${{ steps.week.outputs.week }}
      - run: mise run deps
      # Ubuntu's AppArmor stops Electron's sandbox from making namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Linux runners have no display; xvfb-run gives VSCodium one.
      - run: xvfb-run -a mise run test-integration
      # A timeout counts as cancelled, not failed, and a hung run is the one
      # whose logs matter most.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscodium-logs
          path: |
            extension/.vscode-test/codium-output/
            extension/.vscode-test/user-data/logs/
          include-hidden-files: true
          retention-days: 7
