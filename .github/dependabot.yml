# Version updates wait 7 days after a release, so a compromised one is more
# likely found and pulled first; npm's min-release-age in each .npmrc does the
# same for npm install. Security updates don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-root:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/ovsx
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /tools/vsce
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-extension:
        patterns: ["*"]
    ignore:
      # Must stay at engines.vscode's floor.
      - dependency-name: "@types/vscode"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Must match the Node in the floor's Electron (24 for VS Code 1.135).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
