name: Release

on:
  push:
    branches: [main]
  # Builds and lists a release that already exists, such as one whose push
  # built the wrong commit.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and list, like v0.9.0
        required: true
        type: string

permissions: {}

# mise run would otherwise install every tool in mise.toml, VSCodium too, with
# no GitHub token, since mise-action doesn't pass its own on. Each job installs
# only what it needs through mise-action's install_args.
env:
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  release-please:
    # The registry jobs verify that the .vsix was built on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # The package lives at extension/, so release-please prefixes its outputs
      # with the path; the plain release_created is never set.
      release_created: ${{ steps.release.outputs['extension--release_created'] || steps.given.outputs.release_created }}
      tag_name: ${{ steps.release.outputs['extension--tag_name'] || steps.given.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Only a tag with a GitHub Release, so a run started by hand can't list
      # a branch or an unreleased commit.
      - if: github.event_name == 'workflow_dispatch'
        id: given
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG isn't a version tag"; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

  # A reusable workflow gets no more permissions than its caller grants.
  vsix:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-vsix.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Separate from the build, so no dependency's install script can use this
  # permission to replace a release asset. It restores no cache either, since
  # CI's runs on main write mise's.
  publish:
    needs: [release-please, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: extension/dist
      - run: mise run upload-vsix "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # Separate from the GitHub Release upload, so this job holds only what Open
  # VSX needs: no contents: write, and ovsx installed alone. It runs after the
  # upload, since Open VSX never takes a version number twice: a failed upload
  # leaves nothing on Open VSX, and re-running the failed jobs recovers. id-token: write is
  # for Open VSX's Trusted Publishing; while the open-vsx environment holds an
  # OVSX_PAT secret, ovsx uses that instead
  # (docs/adr/0043-list-each-release-on-open-vsx.md).
  open-vsx:
    needs: [release-please, vsix, publish]
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: extension/dist
      # Before ovsx is even installed: only the file build-vsix.yml attested goes out.
      - run: mise run verify-vsix
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mise run deps-ovsx
      - run: mise run list-open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Beside open-vsx, and for the same reasons: it holds only what the VS Code
  # Marketplace needs, and runs after the GitHub Release upload, since the
  # Marketplace never takes a version number twice either. id-token: write is
  # for azure/login, which signs in as the Azure managed identity whose federated
  # credential names this repository and the vs-marketplace environment
  # (docs/adr/0044-list-each-release-on-the-vs-code-marketplace.md).
  vs-marketplace:
    needs: [release-please, vsix, publish]
    runs-on: ubuntu-latest
    environment: vs-marketplace
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: extension/dist
      # Before vsce is even installed: only the file build-vsix.yml attested goes out.
      - run: mise run verify-vsix
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mise run deps-vsce
      # After the install, so the Azure login exists only while vsce runs.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The ID to add to the edziegle publisher as a Contributor, printed on
      # every run so the first run's log shows it.
      - run: mise run marketplace-member-id
      - run: mise run list-vs-marketplace
