StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = DearReviewer

Packages = RedHat, proselint, write-good, alex, Joblint

[*.md]
# GitHub repository names such as owner/name are not either-or pairs.
TokenIgnores = (edziegle/dear_reviewer|mattpocock/skills)
BasedOnStyles = Vale, RedHat, proselint, write-good, alex, Joblint, House

# Flags every "is", "are" and "be".
write-good.E-Prime = NO
# Duplicates RedHat.PassiveVoice.
write-good.Passive = NO
# Sentence case clashes with MADR's required headings (ADR 0003).
RedHat.Headings = NO
# Flags "pros", which MADR uses.
alex.ProfanityUnlikely = NO
# Our own copy of write-good.TooWordy lives in House.
write-good.TooWordy = NO
# The docs use contractions ("can't", "doesn't"); this rule asks to remove them.
RedHat.Contractions = NO
# The docs write lists without an Oxford comma.
RedHat.OxfordComma = NO
# Command names end in an ellipsis, as VS Code's do ("Locate Clone…").
RedHat.Ellipses = NO
# Contradicts RedHat.TermsErrors, which wants American spelling, and flags "color".
proselint.Spelling = NO
# Written for job ads: flags "fail" and "compete".
Joblint.Competitive = NO
# Commands in the docs take <placeholder> arguments.
RedHat.UserReplacedValues = NO

# Quoted research notes, not prose we write.
[docs/research/**]
BasedOnStyles =

[docs/adr/adr-template*.md]
# MADR's own templates, copied as published.
BasedOnStyles =
