name: Wiki

# The wiki mirrors wiki/ (mise run wiki): a push to main that changes it
# rewrites the wiki's pages. Run it by hand to put back pages edited in the wiki.
on:
  push:
    branches: [main]
    paths: [wiki/**, mise.toml, .github/workflows/wiki.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: false

# One run at a time, so an older run can't push its pages over a newer one's.
concurrency:
  group: wiki

jobs:
  mirror:
    runs-on: ubuntu-latest
    # The wiki is a repository of its own, which the job's token can push to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-clone
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - run: mise run wiki wiki-clone
      - working-directory: wiki-clone
        run: |
          git add --all
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Mirror wiki/ at ${GITHUB_SHA::7}"
          git push
